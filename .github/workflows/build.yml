name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir www && cp index.html manifest.json icon.svg sw.js www/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: dep
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK with Capacitor
        run: |
          mkdir www && cp index.html manifest.json icon.svg sw.js www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "電費計算器" com.watson.electricbill --web-dir www
          npx cap add android
          npx cap sync android
          printf '\nconfigurations.all {\n  resolutionStrategy {\n    force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"\n    force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"\n    force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"\n  }\n}\n' >> android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: electric-bill-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk electric-bill.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest electric-bill.apk --title "電費計算器 APK" --notes "Android 安裝檔"
